name: Split Metrics Layout
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10 
    steps:
      # COLUMN 1: Base Header and Language Stats
      - name: Generate Left Side Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-left.svg
          user: YOUR_GITHUB_USERNAME_HERE
          base: header, repositories
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          config_timezone: Asia/Kolkata 

      # COLUMN 2: Isometric 3D Calendar and Habits
      - name: Generate Right Side Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics-right.svg
          user: YOUR_GITHUB_USERNAME_HERE
          base: "" 
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_days: 7 
          config_timezone: Asia/Kolkata 
