# Visit https://github.com/lowlighter/metrics#-documentation for full reference
name: Metrics
on:
  # Schedule updates (each hour)
  schedule: [{cron: "0 * * * *"}]
  # Lines below let you run workflow manually and on each commit
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # Layout & Sizing (Medium overall, full-year calendar centered at bottom)
          template: classic
          config_display: large
          config_timezone: Asia/Colombo
          base: header, activity, community, repositories, metadata
          config_order: base.header, introduction, base.activity, base.community, base.repositories, languages, repositories, stars, followup, people, isocalendar, base.metadata

          # Custom Spacing & Full-Width Follow-up Bars
          extras_features: yes
          extras_css: |
            section {
              margin-top: 14px;
              margin-bottom: 14px;
            }
            .followup.column,
            .followup .field {
              width: 100%;
            }

          # Follow-up & Introduction
          plugin_followup: yes
          plugin_followup_archived: yes
          plugin_followup_sections: repositories
          plugin_introduction: yes
          plugin_introduction_title: yes

          # Calendar (Centered full-year view)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Languages
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_ignored: html,css
          plugin_languages_limit: 8
          plugin_languages_other: yes
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

          # People, Repositories & Stars
          plugin_people: yes
          plugin_people_limit: 24
          plugin_people_size: 44
          plugin_people_types: followers
          plugin_repositories: yes
          plugin_repositories_order: pinned
          plugin_repositories_pinned: 5
          plugin_stars: yes
          plugin_stars_limit: 4
